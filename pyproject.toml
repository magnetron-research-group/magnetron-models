[project]
name = "magnetron-models"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mario Sieg", email = "mario.sieg.64@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "magnetron>=0.2.3",
]

[tool.uv] # We always want to use latest magnetron
upgrade-package = ["magnetron"]

[project.scripts]
magnetron-models = "magnetron_models:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
inference = [
    "tokenizers>=0.23.3",
]
examples = [
    "huggingface-hub>=1.0.0",
    "sounddevice>=0.5.6",
]

[tool.ruff]
line-length = 150
indent-width = 4
exclude = [
    ".venv",
    "build",
    "docs",
    "extern",
    "test",
    "tools",
    "fuzzer",
    "cmake",
    "bin",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "PERF",
    "RUF",
    "ANN",
]

ignore = [
    "E501",
    "E701",
    "E702",
    "ANN401",
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"setup.py" = ["ANN"]
"test/**/*.py" = ["ANN"]
"tests/**/*.py" = ["ANN"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = true

